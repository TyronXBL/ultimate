name: CI

on:
  push:
    # ci/<sha> is the lander's gate (.ultimate/scripts/ci-gate.ts): every submission's merged commit runs here first.
    # main is left out: the lander pushes main only after that commit passed, and a second run would cost minutes.
    branches: ['ci/**']
  pull_request:

permissions:
  contents: read

# Private repositories pay per job, each rounded up to the minute, on 2-CPU runners (#169933). Four jobs instead of
# nine: each job's ~25 s of setup and its rounding were about half of the billed minutes, and two shards per suite
# keep a run at about 3 min.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: test (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The check takes about 15 s: it rides on the first shard instead of paying for a job of its own.
      - if: matrix.shard == 1
        run: pnpm check
      # High and critical advisories fail; accepted ones go in pnpm-workspace.yaml's auditConfig with a reason.
      - if: matrix.shard == 1
        run: pnpm audit --audit-level high
      # Tests commit in scratch repositories, which needs a git identity as on a developer machine.
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: pnpm test --shard=${{ matrix.shard }}/2

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      # The browser tests use the runner's preinstalled Chrome (/usr/bin/google-chrome-stable), inside its sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor restricts by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
